name: Portfolio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON Data Files
        run: |
          python -m json.tool data/projects.json > /dev/null
          echo "data/projects.json is valid JSON"

      - name: Check HTML Syntax
        run: |
          python -c "
          import html.parser
          with open('index.html', 'r', encoding='utf-8') as f:
              html.parser.HTMLParser().feed(f.read())
          print('index.html parsed successfully')
          "

      - name: Install Test Dependencies & Playwright
        run: |
          pip install playwright pytest
          playwright install chromium

      - name: Start Local Web Server
        run: |
          python -m http.server 8000 &
          sleep 2

      - name: Run Browser Smoke Test
        run: |
          python tests/test_browser_smoke.py
